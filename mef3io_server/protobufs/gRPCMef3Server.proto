syntax = "proto3";

// MEF3 data server: every data call is oriented purely in CHANNELS and TIME.
// Open a file, inspect its metadata (channels, per-channel sampling rate and
// per-channel start/end timestamps), then read any channels over any
// [start_uutc, end_uutc) window via GetSignalRange.
service gRPCMef3Server {
  rpc OpenFile(OpenFileRequest) returns (FileInfoResponse) {}
  rpc CloseFile(FileInfoRequest) returns (FileInfoResponse) {}
  rpc FileInfo(FileInfoRequest) returns (FileInfoResponse) {}
  rpc GetSignalRange(SignalRangeRequest) returns (stream SignalChunk) {}
  rpc ListOpenFiles(ListOpenFilesRequest) returns (ListOpenFilesResponse) {}
  // Per-block min/max of channels from the MEF block index alone (nothing
  // decoded): a whole-day overview for viewers. Each channel in one or more
  // messages (in order), so a long recording stays under message limits.
  rpc GetEnvelope(EnvelopeRequest) returns (stream ChannelEnvelope) {}
}

message OpenFileRequest {
  string file_path = 1;
  // Serve this client's reads (and cache and prefetch them) at this rate, Hz:
  // order-preserving min-max of the original. Unset: each channel's own rate.
  // Refused when a channel is recorded below it, unless allow_mixed_rates.
  optional double cache_fs = 2;
  // With cache_fs: serve a channel recorded below cache_fs at its own rate
  // instead of refusing the open.
  optional bool allow_mixed_rates = 3;
}

message FileInfoRequest {
  string file_path = 1;
}

// File metadata. channel_names, channel_sampling_rates, channel_start_uutc and
// channel_end_uutc are parallel arrays (index i describes channel i).
// start_uutc/end_uutc are the global recording span (min/max over channels).
message FileInfoResponse {
  string file_path = 1;
  bool file_opened = 2;
  optional int64 number_of_channels = 3;
  repeated string channel_names = 4;
  repeated float channel_sampling_rates = 5;
  optional int64 start_uutc = 6;
  optional int64 end_uutc = 7;
  optional double duration_s = 8;
  repeated int64 channel_start_uutc = 9;
  repeated int64 channel_end_uutc = 10;
  // The rate each channel is served at for this client (parallel to
  // channel_names): its own rate, or the session's cache_fs.
  repeated double channel_served_sampling_rates = 11;
  // The session's cache_fs, when it set one.
  optional double cache_fs = 12;
  optional string error_message = 99;
}

// Timestamp-based access: read arbitrary channels over an arbitrary
// [start_uutc, end_uutc) window. Empty channel_names means "all channels".
message SignalRangeRequest {
  string file_path = 1;
  repeated string channel_names = 2;
  int64 start_uutc = 3;
  int64 end_uutc = 4;
  // Return exactly this many points per channel (e.g. one per pixel), chosen
  // by MinMaxLTTB: real samples that keep peaks and the line's shape. Never
  // upsamples: a window holding fewer samples is returned as is.
  optional int64 n_points = 5;
}

message SignalChunk {
  string file_path = 1;
  bytes array_bytes = 2;
  string dtype = 3;
  repeated int64 shape = 4;
  int64 start_uutc = 5;
  int64 end_uutc = 6;
  double fs = 7;
  repeated string channel_names = 8;
  optional string error_message = 99;
}

message ListOpenFilesRequest {}

message ListOpenFilesResponse {
  repeated string file_paths = 1;
  optional string error_message = 99;
}

// Unset start/end: the start/end of each channel. Empty channel_names: all.
message EnvelopeRequest {
  string file_path = 1;
  repeated string channel_names = 2;
  optional int64 start_uutc = 3;
  optional int64 end_uutc = 4;
}

// One row per MEF data block overlapping the window (parallel arrays): the
// block's first sample, just past its last, and its min and max in the
// channel's units (NaN when the writer left them unset). Gaps are absent rows.
message ChannelEnvelope {
  string file_path = 1;
  string channel_name = 2;
  repeated int64 start_uutc = 3;
  repeated int64 end_uutc = 4;
  repeated double min = 5;
  repeated double max = 6;
  optional string error_message = 99;
}
