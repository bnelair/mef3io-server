name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Commands, client calls and config. Never attach patient data; use a synthetic recording.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: mef3io-server, mef3io, Python, OS
